<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование</title>
    <!-- Шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap и Иконки -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #f6f8fd 0%, #f1f4f9 100%);
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-gradient);
            min-height: 100vh;
            color: #333;
        }
        .card { 
            border: none;
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            margin-bottom: 2rem; 
        }
        .btn-primary { background-color: var(--primary-color); border-color: var(--primary-color); }
        .btn-primary:hover { background-color: #4338ca; border-color: #4338ca; }
        .accordion-button:not(.collapsed) { 
            background-color: #eef2ff; 
            color: var(--primary-color); 
        }
        .accordion-button:focus { box-shadow: none; }
        .modal-content { border: none; border-radius: 16px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
        
        .dropdown-menu {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-top: 10px;
        }
        .dropdown-item:active { background-color: var(--primary-color); }
    </style>
</head>
<body>
    <!-- Контейнер для уведомлений -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <!-- Навигационная панель -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm mb-4 d-none" id="main-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-building text-primary"></i> Бронирование переговорной</a>
            
            <div class="d-flex align-items-center">
                <!-- ВЫПАДАЮЩЕЕ МЕНЮ ПРОФИЛЯ -->
                <div class="dropdown">
                    <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2 rounded-pill px-3 py-2" type="button" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle fs-5 text-secondary"></i>
                        <span class="fw-medium" id="user-email-display">User</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
                        <li>
                            <h6 class="dropdown-header">Ваша роль: <span class="badge bg-primary" id="user-role-display">role</span></h6>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <button class="dropdown-item d-flex align-items-center" onclick="openMyBookings()">
                                <i class="bi bi-journal-text text-primary me-2 fs-5"></i> Мои брони
                            </button>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <button class="dropdown-item d-flex align-items-center text-danger" onclick="logout()">
                                <i class="bi bi-box-arrow-right me-2 fs-5"></i> Выйти
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Модальное окно "Мои брони" -->
    <div class="modal fade" id="myBookingsModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold"> Мои бронирования</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div id="my-bookings-list"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Модальное окно "Управление комнатами" (Админ) -->
    <div class="modal fade" id="adminRoomsModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold text-danger"> Управление комнатами</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <button onclick="refreshAdminRoomsList()" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-clockwise"></i> Обновить</button>
            <ul id="admin-rooms-list" class="list-group list-group-flush"></ul>
          </div>
        </div>
      </div>
    </div>

    <!-- Модальное окно "Все брони" (Админ) -->
    <div class="modal fade" id="allBookingsModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold text-danger"> Все бронирования</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <button onclick="refreshAllBookingsList()" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-clockwise"></i> Обновить</button>
            <div id="all-bookings-list"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="container" style="max-width: 900px;">
        
        <!-- Блок Логина -->
        <div class="row justify-content-center align-items-center" style="min-height: 80vh;" id="login-section">
            <div class="col-md-6 col-lg-5">
                <div class="card p-5 text-center">
                    <div class="mb-4">
                        <i class="bi bi-building text-primary" style="font-size: 4rem;"></i>
                    </div>
                    <h3 class="fw-bold mb-4">АВТОРИЗАЦИЯ</h3>
                    <div class="mb-3 text-start">
                        <label class="form-label text-muted small fw-bold">Email</label>
                        <input type="email" id="email" class="form-control form-control-lg bg-light" value="admin@test.com">
                    </div>
                    <div class="mb-4 text-start">
                        <label class="form-label text-muted small fw-bold">Пароль</label>
                        <input type="password" id="password" class="form-control form-control-lg bg-light" value="secret123">
                    </div>
                    <button onclick="login()" class="btn btn-primary btn-lg w-100 fw-bold">Войти</button>
                </div>
            </div>
        </div>

        <!-- Основное приложение (Скрыто до входа) -->
        <div class="d-none" id="app-section">
            
            <!-- Блок Поиска -->
            <div class="card p-4">
                <h4 class="fw-bold mb-4"><i class="bi bi-search text-primary"></i> Поиск переговорной</h4>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted">Начало</label>
                        <input type="datetime-local" id="start_time" class="form-control" onchange="updateMinEndTime(); validateTimeRange();">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted">Конец</label>
                        <input type="datetime-local" id="end_time" class="form-control" onchange="validateTimeRange();">
                        <div id="time-error" class="invalid-feedback">Время окончания должно быть позже начала!</div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-muted">Кол-во человек</label>
                        <input type="number" id="participants" class="form-control" value="1" min="1">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-muted">Оборудование</label>
                        <input type="text" id="equipment" class="form-control" value="projector">
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button onclick="findRooms()" id="search-btn" class="btn btn-success w-100 fw-bold">
                            <i class="bi bi-search"></i> Найти
                        </button>
                    </div>
                </div>
                <div class="mt-4">
                    <div id="rooms-list" class="row g-3"></div>
                </div>
            </div>

            <!-- Панель Админа -->
            <div class="card p-4 border-start border-4 border-danger d-none" id="admin-section">
                <h4 class="fw-bold text-danger mb-4"><i class="bi bi-shield-lock"></i> Панель администратора</h4>
                
                <div class="bg-light p-3 rounded mb-3">
                    <h6 class="fw-bold mb-3">Добавить новую комнату</h6>
                    <div class="row g-2 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label text-muted mb-1" style="font-size: 0.85rem;">Название</label>
                            <input type="text" id="new_room_name" class="form-control form-control-sm" placeholder="Например: Delta">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label text-muted mb-1" style="font-size: 0.85rem;">Мест</label>
                            <input type="number" id="new_room_capacity" class="form-control form-control-sm" value="5">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted mb-1" style="font-size: 0.85rem;">Оборудование</label>
                            <input type="text" id="new_room_equipment" class="form-control form-control-sm" placeholder="projector">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label text-muted mb-1" style="font-size: 0.85rem;">Этаж</label>
                            <input type="number" id="new_room_floor" class="form-control form-control-sm" value="1">
                        </div>
                        <div class="col-md-2">
                            <button onclick="createRoom()" class="btn btn-danger btn-sm w-100">Создать</button>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button onclick="openAdminRooms()" class="btn btn-outline-danger"><i class="bi bi-door-open"></i> Управление комнатами</button>
                    <button onclick="openAllBookings()" class="btn btn-outline-danger"><i class="bi bi-list-task"></i> Все бронирования</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let token = "";
        let currentUser = { email: "", role: "" };
        let notifiedBookings = new Set(); 
        let checkInterval = null;

        //УВЕДОМЛЕНИЯ
        function showToast(message, type = 'success') {
            const toastContainer = document.getElementById("toastContainer");
            const toastId = "toast-" + Date.now();
            
            let icon = '<i class="bi bi-check-circle-fill text-success me-2"></i>';
            let borderClass = 'border-success';
            
            if (type === 'danger') {
                icon = '<i class="bi bi-exclamation-triangle-fill text-danger me-2"></i>';
                borderClass = 'border-danger';
            } else if (type === 'warning') {
                icon = '<i class="bi bi-clock-history text-warning me-2"></i>';
                borderClass = 'border-warning';
            }

            const html = `
                <div id="${toastId}" class="toast align-items-center bg-white border ${borderClass} shadow" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex">
                        <div class="toast-body fw-medium fs-6">
                            ${icon} ${message}
                        </div>
                        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>
            `;
            toastContainer.insertAdjacentHTML('beforeend', html);
            const toastElement = document.getElementById(toastId);
            const toast = new bootstrap.Toast(toastElement, { delay: 6000 });
            toast.show();
            
            toastElement.addEventListener('hidden.bs.toast', () => toastElement.remove());
        }

        //ФОРМАТИРОВАНИЕ ДАТ
        function formatBookingTime(startStr, endStr) {
            const start = new Date(startStr);
            const end = new Date(endStr);
            const pad = (num) => String(num).padStart(2, '0');
            const startH = start.getHours();
            const startM = pad(start.getMinutes());
            const endH = end.getHours();
            const endM = pad(end.getMinutes());
            const startDate = `${pad(start.getDate())}.${pad(start.getMonth() + 1)}.${start.getFullYear()}`;
            const endDate = `${pad(end.getDate())}.${pad(end.getMonth() + 1)}.${end.getFullYear()}`;
            if (startDate === endDate) {
                return `${startH}:${startM} - ${endH}:${endM} (${startDate})`;
            } else {
                return `${startH}:${startM} - ${endH}:${endM} (${startDate} - ${endDate})`;
            }
        }

        function formatDateTime(date) {
            const pad = (num) => String(num).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            now.setMinutes(Math.ceil(now.getMinutes() / 30) * 30, 0, 0);
            const end = new Date(now.getTime() + 60 * 60 * 1000);
            document.getElementById("start_time").value = formatDateTime(now);
            document.getElementById("end_time").value = formatDateTime(end);
            document.getElementById("end_time").min = formatDateTime(now);
        });

        function validateTimeRange() {
            const start = document.getElementById("start_time").value;
            const end = document.getElementById("end_time").value;
            const endInput = document.getElementById("end_time");
            if (!start || !end) return true;
            if (new Date(start) >= new Date(end)) {
                endInput.classList.add("is-invalid");
                return false; 
            } else {
                endInput.classList.remove("is-invalid");
                return true;
            }
        }

        function updateMinEndTime() {
            const startVal = document.getElementById("start_time").value;
            const endInput = document.getElementById("end_time");
            if (!startVal) return;
            endInput.min = startVal;
            if (endInput.value && endInput.value <= startVal) {
                endInput.value = formatDateTime(new Date(new Date(startVal).getTime() + 3600000));
            }
        }

        //ПРОВЕРКА ПРОСРОЧЕННЫХ БРОНЕЙ
        async function checkExpiredBookings() {
            if (currentUser.role !== "admin" || !token) return;
            
            try {
                const response = await fetch("/bookings/all", { headers: { "Authorization": `Bearer ${token}` } });
                if (!response.ok) return;
                
                const bookings = await response.json();
                const now = new Date();
                let expiredCount = 0;
                let expiredRooms = [];

                bookings.forEach(b => {
                    const endTime = new Date(b.end_time);
                    if (endTime < now && !notifiedBookings.has(b.id)) {
                        notifiedBookings.add(b.id);
                        expiredCount++;
                        expiredRooms.push(b.room.name);
                    }
                });

                if (expiredCount > 0) {
                    const roomsStr = expiredRooms.join(", ");
                    showToast(`Время встречи в "${roomsStr}" истекло. Не забудьте удалить бронь, чтобы освободить комнату!`, 'warning');
                }
            } catch (e) {
                console.error("Ошибка проверки броней", e);
            }
        }

        // АВТОРИЗАЦИЯ
        async function login() {
            const formData = new URLSearchParams();
            formData.append("username", document.getElementById("email").value);
            formData.append("password", document.getElementById("password").value);
            const response = await fetch("/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData
            });
            if (response.ok) {
                const data = await response.json();
                token = data.access_token;
                currentUser.email = document.getElementById("email").value;
                currentUser.role = data.role;

                // Меняем экраны
                document.getElementById("login-section").classList.add("d-none");
                document.getElementById("app-section").classList.remove("d-none");
                document.getElementById("main-navbar").classList.remove("d-none");

                // Обновляем данные в профиле
                document.getElementById("user-email-display").innerText = currentUser.email;
                document.getElementById("user-role-display").innerText = currentUser.role;

                if (data.role === "admin") {
                    document.getElementById("admin-section").classList.remove("d-none");
                    
                    checkExpiredBookings(); 
                    if (checkInterval) clearInterval(checkInterval);
                    checkInterval = setInterval(checkExpiredBookings, 60000); 
                }
                showToast("Вы успешно вошли в систему!");
            } else {
                showToast("Ошибка входа. Проверьте пароль.", 'danger');
            }
        }

        function logout() {
            location.reload(); 
        }

        async function findRooms() {
            if (!validateTimeRange()) return; 
            
            const searchBtn = document.getElementById("search-btn");
            const originalText = searchBtn.innerHTML;
            searchBtn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Поиск...`;
            searchBtn.disabled = true;

            const params = new URLSearchParams({
                participants: document.getElementById("participants").value,
                start: document.getElementById("start_time").value,
                end: document.getElementById("end_time").value,
                equipment: document.getElementById("equipment").value
            });
            const response = await fetch(`/rooms/recommend?${params}`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            const rooms = await response.json();
            const list = document.getElementById("rooms-list");
            list.innerHTML = "";
            
            searchBtn.innerHTML = originalText;
            searchBtn.disabled = false;

            if (rooms.length === 0) {
                list.innerHTML = `<div class="col-12 text-center py-4 text-muted">
                    <i class="bi bi-emoji-frown fs-1"></i>
                    <p class="mt-2">Нет свободных комнат на это время</p>
                </div>`;
                return;
            }
            
            rooms.forEach(room => {
                const col = document.createElement("div");
                col.className = "col-md-6";
                col.innerHTML = `
                    <div class="border rounded p-3 h-100 d-flex flex-column justify-content-between bg-white shadow-sm">
                        <div>
                            <h5 class="fw-bold mb-1">${room.name}</h5>
                            <p class="text-muted small mb-2">
                                <i class="bi bi-people-fill"></i> до ${room.capacity} чел. <br>
                                <i class="bi bi-tools"></i> ${room.equipment || 'Без оборудования'}
                            </p>
                        </div>
                        <button onclick="bookRoom(${room.id})" class="btn btn-primary btn-sm w-100 mt-2">Забронировать</button>
                    </div>
                `;
                list.appendChild(col);
            });
        }

        async function bookRoom(roomId) {
            if (!validateTimeRange()) return;
            const response = await fetch("/bookings/", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({
                    room_id: roomId,
                    start_time: document.getElementById("start_time").value,
                    end_time: document.getElementById("end_time").value,
                    participants: parseInt(document.getElementById("participants").value)
                })
            });
            if (response.ok) {
                showToast("Комната успешно забронирована!");
                openMyBookings(); 
            } else {
                const err = await response.json();
                showToast(err.detail || "Ошибка бронирования", 'danger');
            }
        }

        // --- МОИ БРОНИ ---
        async function refreshMyBookingsList() {
            const response = await fetch("/bookings/my", { headers: { "Authorization": `Bearer ${token}` } });
            const bookings = await response.json();
            const container = document.getElementById("my-bookings-list");
            container.innerHTML = "";
            
            if (bookings.length === 0) {
                container.innerHTML = `<div class="text-center py-4 text-muted"><i class="bi bi-calendar-x fs-1"></i><p class="mt-2">У вас пока нет броней</p></div>`;
                return;
            }

            let html = `<div class="accordion" id="myAccordion">`;
            bookings.forEach((b, index) => {
                const timeString = formatBookingTime(b.start_time, b.end_time);
                html += `
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#my-${index}">
                                <span class="fw-bold">${b.room.name}</span>
                                <span class="text-muted ms-3 small">${timeString}</span>
                            </button>
                        </h2>
                        <div id="my-${index}" class="accordion-collapse collapse" data-bs-parent="#myAccordion">
                            <div class="accordion-body bg-light">
                                <div class="row text-muted small mb-3">
                                    <div class="col-6 mb-1"><i class="bi bi-building"></i> Этаж: ${b.room.floor}</div>
                                    <div class="col-6 mb-1"><i class="bi bi-people"></i> Мест: до ${b.room.capacity}</div>
                                    <div class="col-6 mb-1"><i class="bi bi-tools"></i> ${b.room.equipment || 'Нет'}</div>
                                    <div class="col-6 mb-1"><i class="bi bi-person-badge"></i> Участников: ${b.participants}</div>
                                </div>
                                <button onclick="cancelBooking(${b.id})" class="btn btn-outline-danger btn-sm w-100">Отменить бронь</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        async function openMyBookings() {
            await refreshMyBookingsList(); 
            bootstrap.Modal.getOrCreateInstance(document.getElementById('myBookingsModal')).show();
        }

        async function cancelBooking(bookingId) {
            if (!confirm("Отменить это бронирование?")) return;
            const response = await fetch(`/bookings/${bookingId}`, {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${token}` }
            });
            if (response.ok) {
                showToast("Бронь отменена");
                await refreshMyBookingsList(); 
                if (currentUser.role === "admin") {
                    refreshAllBookingsList();
                    refreshAdminRoomsList();
                }
            } else {
                const err = await response.json();
                showToast("Ошибка отмены: " + err.detail, 'danger');
            }
        }

        // --- АДМИН: СОЗДАНИЕ КОМНАТ ---
        async function createRoom() {
            const roomData = {
                name: document.getElementById("new_room_name").value,
                capacity: parseInt(document.getElementById("new_room_capacity").value),
                equipment: document.getElementById("new_room_equipment").value,
                floor: parseInt(document.getElementById("new_room_floor").value)
            };
            const response = await fetch("/rooms/", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify(roomData)
            });
            if (response.ok) {
                showToast(`Комната "${roomData.name}" создана!`);
                document.getElementById("new_room_name").value = ""; 
                refreshAdminRoomsList();
            } else {
                const err = await response.json();
                showToast("Ошибка: " + err.detail, 'danger');
            }
        }

        // --- АДМИН: УПРАВЛЕНИЕ КОМНАТАМИ ---
        async function refreshAdminRoomsList() {
            const response = await fetch("/rooms/", { headers: { "Authorization": `Bearer ${token}` } });
            const rooms = await response.json();
            const list = document.getElementById("admin-rooms-list");
            list.innerHTML = "";
            
            if (rooms.length === 0) {
                list.innerHTML = "<li class='list-group-item text-center text-muted'>Нет комнат</li>";
                return;
            }
            
            rooms.forEach(room => {
                const li = document.createElement("li");
                li.className = "list-group-item d-flex justify-content-between align-items-center";
                li.innerHTML = `
                    <div>
                        <h6 class="mb-1 fw-bold">${room.name}</h6>
                        <small class="text-muted">ID: ${room.id} | Этаж: ${room.floor} | до ${room.capacity} чел. | ${room.equipment || 'Без оборуд.'}</small>
                    </div>
                    <button onclick="deleteRoom(${room.id})" class="btn btn-sm btn-outline-danger">Удалить</button>
                `;
                list.appendChild(li);
            });
        }

        async function openAdminRooms() {
            await refreshAdminRoomsList();
            bootstrap.Modal.getOrCreateInstance(document.getElementById('adminRoomsModal')).show();
        }

        async function deleteRoom(roomId) {
            if (!confirm("Удалить комнату?")) return;
            const response = await fetch(`/rooms/${roomId}`, {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${token}` }
            });
            if (response.ok) {
                showToast("Комната удалена");
                refreshAdminRoomsList(); 
            } else {
                const err = await response.json();
                showToast("Ошибка: " + err.detail, 'danger');
            }
        }

        // --- АДМИН: ВСЕ БРОНИ ---
        async function refreshAllBookingsList() {
            const response = await fetch("/bookings/all", { headers: { "Authorization": `Bearer ${token}` } });
            const bookings = await response.json();
            const container = document.getElementById("all-bookings-list");
            container.innerHTML = "";
            
            if (bookings.length === 0) {
                container.innerHTML = `<div class="text-center py-4 text-muted"><i class="bi bi-inbox fs-1"></i><p class="mt-2">В системе пока нет броней</p></div>`;
                return;
            }
            
            let html = `<div class="accordion" id="allAccordion">`;
            bookings.forEach((b, index) => {
                const timeString = formatBookingTime(b.start_time, b.end_time);
                const isExpired = new Date(b.end_time) < new Date();
                const badge = isExpired ? '<span class="badge bg-warning text-dark ms-auto">Просрочено</span>' : '';
                
                html += `
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#all-${index}">
                                <span class="fw-bold">${b.room.name}</span>
                                <span class="text-muted ms-3 small">${timeString}</span>
                                ${badge}
                                <span class="badge bg-secondary ms-2">Юзер ID: ${b.user_id}</span>
                            </button>
                        </h2>
                        <div id="all-${index}" class="accordion-collapse collapse" data-bs-parent="#allAccordion">
                            <div class="accordion-body bg-light">
                                <div class="row text-muted small mb-3">
                                    <div class="col-6 mb-1"><i class="bi bi-building"></i> Этаж: ${b.room.floor}</div>
                                    <div class="col-6 mb-1"><i class="bi bi-people"></i> Мест: до ${b.room.capacity}</div>
                                    <div class="col-6 mb-1"><i class="bi bi-person-badge"></i> Участников: ${b.participants}</div>
                                    <div class="col-6 mb-1"><i class="bi bi-tools"></i> ${b.room.equipment || 'Нет'}</div>
                                </div>
                                <button onclick="cancelBooking(${b.id})" class="btn btn-danger btn-sm w-100">Удалить бронь</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        async function openAllBookings() {
            await refreshAllBookingsList();
            bootstrap.Modal.getOrCreateInstance(document.getElementById('allBookingsModal')).show();
        }
    </script>
</body>
</html>
